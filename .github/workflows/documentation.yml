name: Documentation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test documentation guard
        run: python3 scripts/test_docs_policy.py
      - name: Check every new commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python3 scripts/check_docs.py --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            python3 scripts/check_docs.py --commit "$HEAD_SHA"
          fi
